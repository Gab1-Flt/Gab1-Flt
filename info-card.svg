  <g class="l17"><text x="28" y="454" class="mono" font-size="13"><tspan fill="#7ee787">gabin@github</tspan><tspan fill="#8b949e">:</tspan><tspan fill="#58a6ff">~</tspan><tspan fill="#8b949e">$ </tspan></text><rect x="150" y="443" width="8" height="14" fill="#58a6ff" class="cursor"/></g>
