<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 490" width="100%" height="100%">
  <defs>
    <style>
      .mono {
        font-family: 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
      }
      .bold {
        font-weight: 700;
      }
      @keyframes fadeSlide {
        0% { opacity: 0; transform: translateY(4px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      .cursor {
        animation: blink 1.1s steps(1) infinite;
      }
      .l0 { opacity: 0; animation: fadeSlide 0.35s ease forwards 0.25s; }
      .l1 { opacity: 0; animation: fadeSlide 0.35s ease forwards 0.33s; }
      .l2 { opacity: 0; animation: fadeSlide 0.35s ease forwards 0.41s; }
      .l3 { opacity: 0; animation: fadeSlide 0.35s ease forwards 0.49s; }
      .l4 { opacity: 0; animation: fadeSlide 0.35s ease forwards 0.57s; }
      .l5 { opacity: 0; animation: fadeSlide 0.35s ease forwards 0.65s; }
      .l6 { opacity: 0; animation: fadeSlide 0.35s ease forwards 0.73s; }
      .l7 { opacity: 0; animation: fadeSlide 0.35s ease forwards 0.81s; }
      .l8 { opacity: 0; animation: fadeSlide 0.35s ease forwards 0.89s; }
      .l9 { opacity: 0; animation: fadeSlide 0.35s ease forwards 0.97s; }
      .l10 { opacity: 0; animation: fadeSlide 0.35s ease forwards 1.05s; }
      .l11 { opacity: 0; animation: fadeSlide 0.35s ease forwards 1.13s; }
      .l12 { opacity: 0; animation: fadeSlide 0.35s ease forwards 1.21s; }
      .l13 { opacity: 0; animation: fadeSlide 0.35s ease forwards 1.29s; }
      .l14 { opacity: 0; animation: fadeSlide 0.35s ease forwards 1.37s; }
      .l15 { opacity: 0; animation: fadeSlide 0.35s ease forwards 1.45s; }
      .l16 { opacity: 0; animation: fadeSlide 0.35s ease forwards 1.53s; }
      .l17 { opacity: 0; animation: fadeSlide 0.35s ease forwards 1.61s; }
    </style>
  </defs>

  <!-- Outer Terminal Window -->
  <rect x="1" y="1" width="518" height="488" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>

