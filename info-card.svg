  <path d="M 1 13 A 12 12 0 0 1 13 1 L 507 1 A 12 12 0 0 1 519 13 L 519 38 L 1 38 Z" fill="#161b22"/>
  <line x1="1" y1="38" x2="519" y2="38" stroke="#30363d" stroke-width="1"/>

